services:
  charon-sync:
    image: ${REGISTRY_PREFIX}charon-rclone:${STACK_NAME:-latest}
    build:
      context: ./rclone
      dockerfile: Dockerfile
    user: "1000:1000"
    stop_grace_period: 120s
    deploy:
      restart_policy:
        condition: any
        delay: 10s
        window: 60s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 64M
    depends_on:
      - git-backup
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/charon_sync_heartbeat && [ $$(($$(date +%s) - $$(stat -c %Y /tmp/charon_sync_heartbeat))) -lt 900 ] || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - GDRIVE_VAULT_PATH=${GDRIVE_VAULT_PATH}
      - RCLONE_CONFIG_SECRET_NAME=charon_rclone_config
      - RCLONE_CACHE_DIR=/var/cache/rclone
      - HOME=/var/cache/rclone
    secrets:
      - source: charon_rclone_config
        target: charon_rclone_config
    volumes:
      - ${OBSIDIAN_VAULT_PATH}/second-brain:/data
      - ${RCLONE_CACHE_PATH}/sync:/var/cache/rclone

    entrypoint: /entrypoint.sh
    networks:
      - aether-net
      - internal
    labels:
      - "com.docker.compose.project=${STACK_NAME}"

  charon-archive:
    image: ${REGISTRY_PREFIX}charon-rclone:${STACK_NAME:-latest}
    build:
      context: ./rclone
      dockerfile: Dockerfile
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 10s
        window: 60s
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - GDRIVE_BACKUP_PATH=${GDRIVE_BACKUP_PATH}
      - RCLONE_CONFIG_SECRET_NAME=charon_rclone_config
      - NODE_HOSTNAME={{.Node.Hostname}}
    secrets:
      - source: charon_rclone_config
        target: charon_rclone_config
    volumes:
      - /mnt/storage/backups:/data
      - ${RCLONE_CACHE_PATH}/archive:/root/.cache/rclone

    entrypoint: /archive-job.sh
    command: setup-cron
    networks:
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"

  git-backup:
    image: ${REGISTRY_PREFIX}charon-git:${STACK_NAME:-latest}
    build:
      context: ./git-backup
      dockerfile: Dockerfile
    user: "1000:1000"
    deploy:
      restart_policy:
        condition: any
        delay: 10s
        window: 60s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 64M
    working_dir: /git
    healthcheck:
      test: ["CMD-SHELL", "test -f .git_ready && (! test -f /tmp/charon_git_heartbeat || [ $$(($$(date +%s) - $$(stat -c %Y /tmp/charon_git_heartbeat))) -lt 7200 ]) || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    entrypoint: /bin/sh
    command: -c '
        git config --global safe.directory /git;
        echo "Starting backup script...";
        /usr/local/bin/git-backup.sh;
      '
    environment:
      - GIT_REPO_URL=${GIT_REPO_URL}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - ENV=${ENV}
      - HOME=/tmp
    secrets:
      - source: charon_ssh_key
        target: charon_ssh_key
    volumes:
      - ${OBSIDIAN_VAULT_PATH}:/git
    networks:
      - aether-net
      - internal
    labels:
      - "com.docker.compose.project=${STACK_NAME}"

networks:
  aether-net:
    external: true
  internal:
    driver: overlay

secrets:
  charon_rclone_config:
    external: true
    name: ${CHARON_RCLONE_CONFIG_NAME}
  charon_ssh_key:
    external: true
    name: ${CHARON_SSH_KEY_NAME}
