name: Deploy Atlas Infra

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate Required Configuration
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          EIR_DB_PASSWORD: ${{ secrets.EIR_DB_PASSWORD }}
          KRATOS_DB_PASSWORD: ${{ secrets.KRATOS_DB_PASSWORD }}
          IRIS_DB_PASSWORD: ${{ secrets.IRIS_DB_PASSWORD }}
          PLUTUS_DB_PASSWORD: ${{ secrets.PLUTUS_DB_PASSWORD }}
          ODYSSEUS_DB_PASSWORD: ${{ secrets.ODYSSEUS_DB_PASSWORD }}
          CHRONOS_DB_PASSWORD: ${{ secrets.CHRONOS_DB_PASSWORD }}
          GIT_REPO_URL: ${{ vars.GIT_REPO_URL }}
          ODIN_GIT_REPO_URL: ${{ vars.ODIN_GIT_REPO_URL }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
        run: |
          MISSING=""
          [ -z "$DOMAIN_NAME" ] && MISSING="$MISSING DOMAIN_NAME"
          [ -z "$EIR_DB_PASSWORD" ] && MISSING="$MISSING EIR_DB_PASSWORD"
          [ -z "$KRATOS_DB_PASSWORD" ] && MISSING="$MISSING KRATOS_DB_PASSWORD"
          [ -z "$IRIS_DB_PASSWORD" ] && MISSING="$MISSING IRIS_DB_PASSWORD"
          [ -z "$PLUTUS_DB_PASSWORD" ] && MISSING="$MISSING PLUTUS_DB_PASSWORD"
          [ -z "$ODYSSEUS_DB_PASSWORD" ] && MISSING="$MISSING ODYSSEUS_DB_PASSWORD"
          [ -z "$CHRONOS_DB_PASSWORD" ] && MISSING="$MISSING CHRONOS_DB_PASSWORD"
          [ -z "$GIT_REPO_URL" ] && MISSING="$MISSING GIT_REPO_URL"
          [ -z "$ODIN_GIT_REPO_URL" ] && MISSING="$MISSING ODIN_GIT_REPO_URL"
          [ -z "$GIT_USER_EMAIL" ] && MISSING="$MISSING GIT_USER_EMAIL"
          [ -z "$GIT_USER_NAME" ] && MISSING="$MISSING GIT_USER_NAME"
          if [ -n "$MISSING" ]; then
            echo "::error::Deployment halted: missing required configuration:$MISSING" >&2
            exit 1
          fi

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL || format('registry.{0}', vars.DOMAIN_NAME) }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      - name: Setup Secrets
        env:
          SSH_KEY: ${{ secrets.VAULT_BACKUP_SSH_KEY }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
          AUTHENTIK_POSTGRES_PASSWORD: ${{ secrets.AUTHENTIK_POSTGRES_PASSWORD }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          echo "CHARON_SSH_KEY_NAME=$(echo "$SSH_KEY" | /tmp/ensure_secret.sh charon_ssh_key)" >> $GITHUB_ENV
          echo "CHARON_RCLONE_CONFIG_NAME=$(echo "$RCLONE_CONFIG" | /tmp/ensure_secret.sh charon_rclone_config)" >> $GITHUB_ENV
          echo "CHARON_AUTHENTIK_POSTGRES_PASSWORD_NAME=$(echo "$AUTHENTIK_POSTGRES_PASSWORD" | /tmp/ensure_secret.sh charon_authentik_postgres_password)" >> $GITHUB_ENV

      - name: Deploy Stack
        env:
          # Infrastructure Vars
          OBSIDIAN_VAULT_PATH: ${{ vars.OBSIDIAN_VAULT_PATH }}
          RCLONE_CACHE_PATH: ${{ vars.RCLONE_CACHE_PATH }}
          GDRIVE_VAULT_PATH: ${{ vars.GDRIVE_VAULT_PATH }}
          GDRIVE_BACKUP_PATH: ${{ vars.GDRIVE_BACKUP_PATH }}
          # Database Passwords
          EIR_DB_PASSWORD: ${{ secrets.EIR_DB_PASSWORD }}
          KRATOS_DB_PASSWORD: ${{ secrets.KRATOS_DB_PASSWORD }}
          IRIS_DB_PASSWORD: ${{ secrets.IRIS_DB_PASSWORD }}
          PLUTUS_DB_PASSWORD: ${{ secrets.PLUTUS_DB_PASSWORD }}
          ODYSSEUS_DB_PASSWORD: ${{ secrets.ODYSSEUS_DB_PASSWORD }}
          CHRONOS_DB_PASSWORD: ${{ secrets.CHRONOS_DB_PASSWORD }}
          # Git Config
          GIT_REPO_URL: ${{ vars.GIT_REPO_URL }}
          ODIN_GIT_REPO_URL: ${{ vars.ODIN_GIT_REPO_URL }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
          ENV: ${{ vars.ENV }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          # Secret Names
          CHARON_AUTHENTIK_POSTGRES_PASSWORD_NAME: ${{ env.CHARON_AUTHENTIK_POSTGRES_PASSWORD_NAME }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "charon" docker-compose.yml

      - name: Verify Post-Deploy Swarm Convergence
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/verify_convergence.sh -o /tmp/verify_convergence.sh
          chmod +x /tmp/verify_convergence.sh
          /tmp/verify_convergence.sh "charon" charon_charon-archive charon_charon-dumper-gaia charon_charon-dumper-muspelheim charon_charon-sync charon_git-backup
